name: Keep Render API awake

# Render free tier spins down after ~15 min idle. Ping liveness so the instance
# stays warm between user visits. Runs only on main after deploy.
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API liveness
        run: |
          curl -sf --max-time 120 \
            "https://personal-expense-tracker-c2p8.onrender.com/api/health/live" \
            || echo "Ping failed (cold start may still be in progress)"
